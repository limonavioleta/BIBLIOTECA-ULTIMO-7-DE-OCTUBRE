<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Lector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="max-width: 600px;">

    <h2>Editar Lector: {{ lector.nombre_completo }}</h2>

    <form method="POST" class="card card-body shadow-sm mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'listar_lectores' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
    </form>

</body>
</html>
